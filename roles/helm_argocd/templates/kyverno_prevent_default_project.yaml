apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: application-prevent-default-project
  annotations:
    policies.kyverno.io/title: Prevent Use of Default Project
    policies.kyverno.io/category: Argo
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Application
    policies.kyverno.io/description: >
      This policy prevents the use of the default project in an Argo CD Application.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-default-project
      match:
        any:
          - resources:
              kinds:
                - Application
      preconditions:
        all:
          - key: "{% raw %}{{ request.operation or 'BACKGROUND' }}{% endraw %}"
            operator: NotEquals
            value: ["CREATE", "UPDATE"]
      validate:
        message: "The default project may not be used in an Argo CD Application."
        pattern:
          spec:
            project: "!default"
