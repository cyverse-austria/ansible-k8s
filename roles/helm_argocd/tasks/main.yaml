---
- name: Ensure kubernetes.core collection is installed
  ansible.builtin.command: ansible-galaxy collection install kubernetes.core
  register: install_k8s_collection
  failed_when: install_k8s_collection.rc != 0 and "'Requirement already satisfied' not in install_k8s_collection.stderr"
  changed_when: "'Requirement already satisfied' not in install_k8s_collection.stderr"
  tags:
    - always
    
# apply on the default ns
- name: Apply Kyverno ClusterPolicy to prevent default project in Argo CD Applications
  kubernetes.core.k8s:
    api_version: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: application-prevent-default-project
      annotations:
        policies.kyverno.io/title: Prevent Use of Default Project
        policies.kyverno.io/category: Argo
        policies.kyverno.io/severity: medium
        policies.kyverno.io/subject: Application
        policies.kyverno.io/description: |
          This policy prevents the use of the default project in an Argo CD Application.
    spec:
      validationFailureAction: Enforce
      background: true
      rules:
        - name: disallow-default-project
          match:
            any:
              - resources:
                  kinds:
                    - Application
          preconditions:
            all:
              - key: "{{ request.operation || 'BACKGROUND' }}"
                operator: NotEquals
                value:
                  - CREATE
                  - UPDATE
          validate:
            message: "The default project may not be used in an Argo CD Application."
            pattern:
              spec:
                project: "!default"

- name: Add Argocd Helm repository
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  register: add_argocd_repo
  changed_when: "'has been added' in add_argocd_repo.stdout or 'already exists' in add_argocd_repo.stderr"

- name: Update Helm repositories
  ansible.builtin.command: helm repo update

- name: Ensure directory for Argocd values exists
  ansible.builtin.file:
    path: /etc/kubernetes/argocd
    state: directory
    mode: '0755'

- name: Render Argocd values file with template
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /etc/kubernetes/argocd/argocd-values.yaml
    mode: '0644'

- name: Install or upgrade Argocd via Helm
  ansible.builtin.command: >
    helm upgrade --install argocd argo/argo-cd
    --namespace argocd
    --create-namespace
    --version {{ argocd_helm_version }}
    -f /etc/kubernetes/argocd/argocd-values.yaml

- name: Wait for ArgoCD pods to be ready
  ansible.builtin.shell: |
    kubectl wait --for=condition=Ready pods -n argocd --selector=app.kubernetes.io/instance=argocd --timeout=300s
  retries: 3
  delay: 10
  register: argocd_wait
  until: argocd_wait.rc == 0


- name: Wait for Cilium pods to be ready
  ansible.builtin.shell: |
    kubectl wait --for=condition=Ready pods -n kube-system -l k8s-app=cilium --timeout=300s
  retries: 3
  delay: 10
  register: cilium_wait
  until: cilium_wait.rc == 0

