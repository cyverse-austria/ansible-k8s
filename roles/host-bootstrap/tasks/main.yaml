- name: Ensure ansible user exists
  user:
    name: ansible
    shell: /bin/bash
    create_home: yes

- name: Ensure .ssh directory exists
  file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'

- name: Install SSH public key for ansible
  authorized_key:
    user: ansible
    key: "{{ ANSIBLE_PUB_KEY }}"
    state: present

- name: Ensure sudo is installed
  package:
    name: sudo
    state: present

- name: Allow ansible user to become root without password
  copy:
    dest: /etc/sudoers.d/ansible
    content: |
      ansible ALL=(ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: '0440'
