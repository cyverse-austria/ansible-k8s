---
# this is temp- should find a way to avoid
- name: create the "{{ lcalyze_ns }}" namespace
  kubernetes.core.k8s:
    name: "{{ lcalyze_ns }}"
    state: present
    kind: namespace
    api_version: v1

- name: create the harbor json file
  ansible.builtin.copy:
    dest: "harbor_login.json"
    content: "{}"

- name: create the harbor dockerconfigjson content manually
  ansible.builtin.set_fact:
    dockerconfigjson_content: |
      {
        "auths": {
          "{{ harbor_url }}": {
            "auth": "{{ (harbor_robot_name + ':' + harbor_robot_secret) | b64encode }}"
          }
        }
      }

- name: Create the harbor image pull secret
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: v1
      data:
        .dockerconfigjson: "{{ dockerconfigjson_content | to_json | b64encode }}"
      kind: Secret
      metadata:
        name: "{{ image_pull_secret_name }}"
        namespace: "{{ item }}"
      type: "kubernetes.io/dockerconfigjson"
  with_items:
    - "{{ lcalyze_ns }}"

- name: remove the tempfile for the harbor login json
  ansible.builtin.file:
    path: harbor_login.json
    state: absent

################################
- name: create the gitlab json file
  ansible.builtin.copy:
    dest: "gitlab_login.json"
    content: "{}"
  when: gitlab_registry_secret | bool

- name: create the gitlab dockerconfigjson content manually
  ansible.builtin.set_fact:
    gitlab_dockerconfigjson_content: |
      {
        "auths": {
          "{{ gitlab_registry_url }}": {
            "auth": "{{ ('gitlab-ci-token:' + gitlab_token) | b64encode }}"
          }
        }
      }
  when: gitlab_registry_secret | bool

- name: Create the gitlab image pull secret
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: v1
      data:
        .dockerconfigjson: "{{ gitlab_dockerconfigjson_content | to_json | b64encode }}"
      kind: Secret
      metadata:
        name: "{{ gitlab_image_pull_secret_name }}"
        namespace: "{{ item }}"
      type: "kubernetes.io/dockerconfigjson"
  with_items:
    - "{{ lcalyze_ns }}"
  when: gitlab_registry_secret | bool

- name: remove the tempfile for the gitlab login json
  ansible.builtin.file:
    path: gitlab_login.json
    state: absent
  when: gitlab_registry_secret | bool
